name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
            qt-arch: linux_gcc_64
          - os: windows-2025
            triplet: x64-windows
            qt-arch: win64_msvc2022_64
          # Xcode 26 provides std::jthread and std::stop_token without experimental flags.
          - os: macos-26
            triplet: arm64-osx
            qt-arch: clang_64
            cache-prefix: vcpkg-macos14.4-v2
    env:
      VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-cache
      VCPKG_MAX_CONCURRENCY: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Restore pinned vcpkg path after MSVC setup
        if: runner.os == 'Windows'
        shell: pwsh
        # vcvarsall sets VCPKG_ROOT to Visual Studio's bundled vcpkg.
        run: '"VCPKG_ROOT=$env:GITHUB_WORKSPACE/build/vcpkg" >> $env:GITHUB_ENV'

      - name: Install official Qt binaries
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.12.0'
          # Pin upstream support for Qt 6.11+ Windows repository layouts.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4'
          arch: ${{ matrix.qt-arch }}
          # SVG and Declarative are included in the base desktop SDK.
          modules: 'qtshadertools qtgraphs qtimageformats qtquick3d qtquicktimeline'
          cache: true

      - name: Check out pinned vcpkg
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: build/vcpkg

      - name: Prepare binary cache
        id: cache-image
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"

      - name: Restore scientific dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/vcpkg-cache
          key: ${{ matrix.cache-prefix || 'vcpkg' }}-${{ runner.os }}-${{ matrix.triplet }}-${{ steps.cache-image.outputs.image }}-${{ hashFiles('vcpkg.json', 'packaging/triplets/**') }}
          restore-keys: |
            ${{ matrix.cache-prefix || 'vcpkg' }}-${{ runner.os }}-${{ matrix.triplet }}-${{ steps.cache-image.outputs.image }}-
            ${{ matrix.cache-prefix || 'vcpkg' }}-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Bootstrap vcpkg on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics'

      - name: Configure
        shell: bash
        run: |
          args=(-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DIMAGECXX_BUILD_BENCHMARKS=ON)
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=14.4 -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/packaging/triplets")
          fi
          cmake --preset release-vcpkg "${args[@]}"

      - name: Save scientific dependency cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset release-vcpkg

      - name: Add dependency runtime libraries on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/build/release-vcpkg/vcpkg_installed/${{ matrix.triplet }}/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: ctest --preset release-vcpkg --timeout 120

      - name: Test macOS packaging audit
        if: runner.os == 'macOS'
        run: python3 tests/macos_package_tests.py

      - name: Test installer routing
        run: node tests/installer_tests.js

      - name: Install Linux graphics test runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1-mesa-dri libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Run graphics and plot tests on Linux
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          QSG_RHI_BACKEND: opengl
        run: xvfb-run -a ./build/release-vcpkg/imagecxx_ui_tests --gtest_filter='Viewer.Gpu*:Plots.*'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-logs-${{ matrix.os }}
          path: build/release-vcpkg/Testing/Temporary/
          if-no-files-found: ignore
